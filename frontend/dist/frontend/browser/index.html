<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>ULA Inventario</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased">
  <app-root></app-root>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:99999;font-family:monospace;white-space:pre-wrap;';
      errDiv.innerText = 'JS Error: ' + message + '\n\n' + (error && error.stack ? error.stack : '');
      document.body.appendChild(errDiv);
    };
    window.addEventListener('unhandledrejection', function(event) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:darkred;color:white;padding:20px;z-index:99999;font-family:monospace;white-space:pre-wrap;';
      errDiv.innerText = 'Promise Rejection: ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason);
      document.body.appendChild(errDiv);
    });
  </script>
<script src="polyfills.js" type="module"></script><script src="main.js" type="module"></script></body>

</html>
