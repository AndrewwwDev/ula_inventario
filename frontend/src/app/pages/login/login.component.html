<div class="min-h-screen flex flex-col items-center justify-center p-4 bg-white">
  
  <div class="w-full max-w-md flex flex-col items-center space-y-8">
    
    <!-- Logo Section -->
    <div class="flex flex-col items-center space-y-4">
      <img src="assets/logo.png" alt="Universidad de Los Andes" class="h-28 object-contain">
      <h1 class="text-3xl font-bold tracking-tight">
        <span class="text-primary">ULA</span> <span class="text-gray-800">INVENTARIO</span>
      </h1>
      <h2 class="text-xl font-medium text-gray-800 mt-2">Registro de bienes</h2>
    </div>

    <!-- Login Form -->
    <form class="w-full space-y-6 mt-8" (ngSubmit)="login()">
      
      <!-- Usuario Field -->
      <div class="space-y-2">
        <label class="flex items-center text-sm font-semibold text-gray-700">
          <span class="material-icons-outlined text-primary mr-2 text-xl">person</span>
          Usuario
        </label>
        <input 
          type="text" 
          name="id" 
          [(ngModel)]="id" 
          placeholder="ID"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow"
          required
        >
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label class="flex items-center text-sm font-semibold text-gray-700">
          <span class="material-icons-outlined text-primary mr-2 text-xl">lock</span>
          Contraseña
        </label>
        <div class="relative">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            name="password" 
            [(ngModel)]="password" 
            placeholder="No compartas tu contraseña con nadie!"
            class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow"
            required
          >
          <button 
            type="button" 
            (click)="togglePassword()"
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none"
          >
            <span class="material-icons-outlined">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <div *ngIf="errorMessage" class="mb-4 text-red-600 text-sm font-medium text-center bg-red-50 p-2 rounded-lg border border-red-200">
          {{ errorMessage }}
        </div>
        <button 
          type="submit" 
          [disabled]="!id || !password || isLoading"
          class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3 px-4 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isLoading ? 'CARGANDO...' : 'INICIO' }}
        </button>
      </div>
      
    </form>

    <!-- Forgot Password -->
    <div class="mt-8 text-sm font-medium text-gray-600 text-center">
      ¿Olvidaste tu contraseña? 
      <a href="#" class="text-primary hover:underline ml-1">Haz clic para recuperarla</a>
    </div>

  </div>
</div>
