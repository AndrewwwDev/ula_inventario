<div class="min-h-screen flex flex-col items-center justify-center p-4 bg-white">
  <div class="w-full max-w-4xl flex flex-col items-center space-y-8">

    <!-- Logo Section -->
    <div class="flex flex-col items-center space-y-4">
      <img src="assets/logo.png" alt="Universidad de Los Andes" class="h-28 object-contain">
      <h1 class="text-3xl font-bold tracking-tight">
        <span class="text-primary">ULA</span> <span class="text-gray-800">INVENTARIO</span>
      </h1>
      <h2 class="text-xl font-medium text-gray-800 mt-2">Revisa tus bienes</h2>
    </div>

    <!-- Search Form -->
    <form class="w-full max-w-md space-y-6" (ngSubmit)="buscarBienes()">
      <div class="space-y-2">
        <label class="flex items-center text-sm font-semibold text-gray-700">
          <span class="material-icons-outlined text-primary mr-2 text-xl">person</span>
          Cédula del Encargado
        </label>
        <input type="text" name="cedula" [(ngModel)]="cedula" placeholder="Ingresa la cédula"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow"
          required>
      </div>

      <button type="submit" [disabled]="!cedula.trim() || isLoading"
        class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3 px-4 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isLoading ? 'BUSCANDO...' : 'BUSCAR BIENES' }}
      </button>
    </form>

    <!-- Results -->
    <div *ngIf="bienes.length > 0" class="w-full max-w-4xl">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Bienes Asignados</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let bien of bienes" class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
          <div *ngIf="bien.imagen_url" class="mb-3">
            <img *ngIf="bien.imagen_url" [src]="bien.imagen_url" alt="Imagen del bien" class="w-full h-32 object-cover rounded">
          </div>
          <div class="space-y-1">
            <p class="text-sm font-medium text-gray-900">{{ bien.nombre }}</p>
            <p class="text-xs text-gray-600">Código: {{ bien.codigo }}</p>
            <p class="text-xs text-gray-600">Estado: {{ bien.estado_operativo }}</p>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="bienes.length === 0 && !isLoading && hasSearched" class="text-gray-600">
      No se encontraron bienes para esta cédula.
    </div>

    <!-- Back Button -->
    <button (click)="volver()" class="mt-8 text-primary hover:underline">
      Volver al inicio
    </button>

  </div>
</div>
