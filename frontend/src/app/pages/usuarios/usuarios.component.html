<div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden relative">
  <div class="p-6 border-b border-gray-200 flex justify-between items-center">
    <div>
      <h2 class="text-xl font-bold text-gray-800">Gestión de Usuarios</h2>
      <p class="text-sm text-gray-500">Administra los roles y accesos del sistema</p>
    </div>
    <button 
      (click)="openCreateModal()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center transition-colors shadow-sm">
      <span class="material-icons-outlined mr-2 text-sm">person_add</span>
      Crear Usuario
    </button>
  </div>

  <div class="p-6">
    <div *ngIf="loading" class="text-center py-4 text-gray-500">
      Cargando usuarios...
    </div>

    <div *ngIf="!loading" class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cédula</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cargo</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let u of usuarios" [ngClass]="{'bg-red-50': u.estado_cuenta === 'Inhabilitado'}">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ u.cedula }}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">{{ u.nombres }} {{ u.apellidos }}</div>
              <div class="text-sm text-gray-500">{{ u.email }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ u.cargo }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <select 
                [ngModel]="u.rol" 
                (ngModelChange)="updateRole(u, $event)"
                [disabled]="u.cedula === currentUserCedula"
                class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md"
                [ngClass]="{'opacity-50 cursor-not-allowed': u.cedula === currentUserCedula}">
                <option value="Usuario">Usuario</option>
                <option value="Administrador">Administrador</option>
                <option value="Super Administrador">Super Administrador</option>
              </select>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                [ngClass]="{
                  'bg-green-100 text-green-800': u.estado_cuenta === 'Activo',
                  'bg-red-100 text-red-800': u.estado_cuenta === 'Inhabilitado'
                }">
                {{ u.estado_cuenta }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button 
                (click)="toggleEstado(u)"
                [disabled]="u.cedula === currentUserCedula"
                class="text-blue-600 hover:text-blue-900 disabled:opacity-50 disabled:cursor-not-allowed"
                title="{{ u.estado_cuenta === 'Activo' ? 'Inhabilitar cuenta' : 'Activar cuenta' }}">
                {{ u.estado_cuenta === 'Activo' ? 'Inhabilitar' : 'Activar' }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Crear Usuario -->
  <div *ngIf="showCreateModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white z-10">
        <h3 class="text-xl font-bold text-gray-800 flex items-center">
          <span class="material-icons-outlined mr-2 text-blue-600">person_add</span>
          Crear Nuevo Usuario
        </h3>
        <button (click)="closeCreateModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
          <span class="material-icons-outlined">close</span>
        </button>
      </div>

      <div class="p-6">
        <form (ngSubmit)="createUser()" #userForm="ngForm" class="space-y-4">
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cédula -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Cédula *</label>
              <input type="text" [(ngModel)]="newUser.cedula" name="cedula" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Cargo -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Cargo *</label>
              <input type="text" [(ngModel)]="newUser.cargo" name="cargo" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Nombres -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nombres *</label>
              <input type="text" [(ngModel)]="newUser.nombres" name="nombres" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Apellidos -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos *</label>
              <input type="text" [(ngModel)]="newUser.apellidos" name="apellidos" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Email -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico *</label>
              <input type="email" [(ngModel)]="newUser.email" name="email" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Password -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña (Mín. 6 caracteres) *</label>
              <input type="password" [(ngModel)]="newUser.password" name="password" required minlength="6"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Rol -->
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Rol en el Sistema *</label>
              <select [(ngModel)]="newUser.rol" name="rol" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                <option value="Usuario">Usuario (Acceso Básico)</option>
                <option value="Administrador">Administrador (Gestión de Bienes)</option>
                <option value="Super Administrador">Super Administrador (Acceso Total)</option>
              </select>
            </div>
          </div>

          <!-- Acciones -->
          <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-gray-100">
            <button type="button" (click)="closeCreateModal()" [disabled]="creatingUser"
              class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none disabled:opacity-50">
              Cancelar
            </button>
            <button type="submit" [disabled]="!userForm.form.valid || creatingUser"
              class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
              <span *ngIf="creatingUser" class="material-icons-outlined animate-spin text-sm mr-2">autorenew</span>
              {{ creatingUser ? 'Creando...' : 'Crear Usuario' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
