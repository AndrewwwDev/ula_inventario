<div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
  <div class="p-6 border-b border-gray-200 flex justify-between items-center">
    <div>
      <h2 class="text-xl font-bold text-gray-800">Gestión de Usuarios</h2>
      <p class="text-sm text-gray-500">Administra los roles y accesos del sistema</p>
    </div>
  </div>

  <div class="p-6">
    <div *ngIf="loading" class="text-center py-4 text-gray-500">
      Cargando usuarios...
    </div>

    <div *ngIf="!loading" class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cédula</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cargo</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let u of usuarios" [ngClass]="{'bg-red-50': u.estado_cuenta === 'Inhabilitado'}">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ u.cedula }}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">{{ u.nombres }} {{ u.apellidos }}</div>
              <div class="text-sm text-gray-500">{{ u.email }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ u.cargo }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <select 
                [ngModel]="u.rol" 
                (ngModelChange)="updateRole(u, $event)"
                [disabled]="u.cedula === currentUserCedula"
                class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md"
                [ngClass]="{'opacity-50 cursor-not-allowed': u.cedula === currentUserCedula}">
                <option value="Usuario">Usuario</option>
                <option value="Administrador">Administrador</option>
                <option value="Super Administrador">Super Administrador</option>
              </select>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                [ngClass]="{
                  'bg-green-100 text-green-800': u.estado_cuenta === 'Activo',
                  'bg-red-100 text-red-800': u.estado_cuenta === 'Inhabilitado'
                }">
                {{ u.estado_cuenta }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button 
                (click)="toggleEstado(u)"
                [disabled]="u.cedula === currentUserCedula"
                class="text-blue-600 hover:text-blue-900 disabled:opacity-50 disabled:cursor-not-allowed"
                title="{{ u.estado_cuenta === 'Activo' ? 'Inhabilitar cuenta' : 'Activar cuenta' }}">
                {{ u.estado_cuenta === 'Activo' ? 'Inhabilitar' : 'Activar' }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
