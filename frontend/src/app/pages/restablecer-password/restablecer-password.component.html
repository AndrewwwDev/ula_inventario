<div class="min-h-screen flex flex-col items-center justify-center p-4 bg-white">

  <div class="w-full max-w-md flex flex-col items-center space-y-8">

    <!-- Logo Section -->
    <div class="flex flex-col items-center space-y-4">
      <img src="assets/logo.png" alt="Universidad de Los Andes" class="h-28 object-contain">
      <h1 class="text-3xl font-bold tracking-tight">
        <span class="text-primary">ULA </span> <span class="text-gray-800">INVENTARIO</span>
      </h1>
      <h2 class="text-xl font-medium text-gray-800 mt-2">Restablecer Contraseña</h2>
    </div>

    <!-- Error/Expired State -->
    <div *ngIf="errorMessage && !userEmail" class="w-full text-center space-y-4 animate-fade-in-up">
      <div class="bg-red-50 p-4 rounded-xl border border-red-200">
        <span class="material-icons-outlined text-red-500 text-4xl mb-2">error_outline</span>
        <p class="text-red-700 font-medium">{{ errorMessage }}</p>
      </div>
      <button routerLink="/login" class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3 px-4 rounded-xl transition-colors">
        Volver al Login
      </button>
    </div>

    <!-- Reset Form -->
    <form *ngIf="userEmail" class="w-full space-y-6 mt-8 animate-fade-in-up" (ngSubmit)="updatePassword()" #resetForm="ngForm">

      <!-- Correo Electrónico (Solo Lectura) -->
      <div class="space-y-2">
        <label class="flex items-center text-sm font-semibold text-gray-700">
          <span class="material-icons-outlined text-gray-400 mr-2 text-xl">account_circle</span>
          Cuenta Verificada
        </label>
        <input type="text" [value]="userEmail" disabled
          class="w-full px-4 py-3 border border-gray-200 bg-gray-50 text-gray-500 rounded-xl cursor-not-allowed font-medium">
      </div>

      <!-- New Password Field -->
      <div class="space-y-2">
        <label class="flex items-center text-sm font-semibold text-gray-700">
          <span class="material-icons-outlined text-primary mr-2 text-xl">lock</span>
          Nueva Contraseña
        </label>
        <div class="relative">
          <input [type]="showNewPassword ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword"
            placeholder="Mínimo 6 caracteres"
            class="w-full px-4 py-3 pr-12 border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow"
            [ngClass]="{'border-red-500': newCtrl.invalid && (newCtrl.dirty || newCtrl.touched), 'border-gray-300': !(newCtrl.invalid && (newCtrl.dirty || newCtrl.touched))}"
            required minlength="6" #newCtrl="ngModel">
          <button type="button" (click)="toggleNewPassword()"
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none">
            <span class="material-icons-outlined">
              {{ showNewPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
        <div *ngIf="newCtrl.invalid && (newCtrl.dirty || newCtrl.touched)"
          class="text-red-500 text-xs mt-1 font-medium">
          <div *ngIf="newCtrl.errors?.['required']">La nueva contraseña es obligatoria.</div>
          <div *ngIf="newCtrl.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</div>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="space-y-2">
        <label class="flex items-center text-sm font-semibold text-gray-700">
          <span class="material-icons-outlined text-primary mr-2 text-xl">lock_reset</span>
          Confirmar Contraseña
        </label>
        <div class="relative">
          <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword"
            placeholder="Repita su nueva contraseña"
            class="w-full px-4 py-3 pr-12 border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow"
            [ngClass]="{'border-red-500': (confirmCtrl.invalid || newPassword !== confirmPassword) && (confirmCtrl.dirty || confirmCtrl.touched), 'border-gray-300': !((confirmCtrl.invalid || newPassword !== confirmPassword) && (confirmCtrl.dirty || confirmCtrl.touched))}"
            required minlength="6" #confirmCtrl="ngModel">
          <button type="button" (click)="toggleConfirmPassword()"
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none">
            <span class="material-icons-outlined">
              {{ showConfirmPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
        <div *ngIf="(confirmCtrl.invalid || newPassword !== confirmPassword) && (confirmCtrl.dirty || confirmCtrl.touched)"
          class="text-red-500 text-xs mt-1 font-medium">
          <div *ngIf="confirmCtrl.errors?.['required']">Confirmar la contraseña es obligatorio.</div>
          <div *ngIf="!confirmCtrl.errors?.['required'] && newPassword !== confirmPassword">Las contraseñas no coinciden.</div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <div *ngIf="errorMessage && userEmail"
          class="mb-4 text-red-600 text-sm font-medium text-center bg-red-50 p-2 rounded-lg border border-red-200">
          {{ errorMessage }}
        </div>
        <button type="submit" [disabled]="resetForm.invalid || isLoading || newPassword !== confirmPassword"
          class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3 px-4 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          {{ isLoading ? 'GUARDANDO...' : 'GUARDAR CONTRASEÑA' }}
        </button>
      </div>

    </form>

  </div>
</div>
