<div class="w-full">
  <!-- Stats Row 1: Operatividad -->
  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Estado Operativo</h3>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div *ngFor="let stat of stats | slice:0:7" (click)="navigateTo(stat)" class="bg-white rounded-xl shadow-sm border p-5 flex items-center justify-between cursor-pointer hover:shadow-md transition-shadow hover:scale-[1.02] transform duration-200 {{stat.border}}">
      <div>
        <p class="text-sm font-medium text-gray-500 mb-1" [ngClass]="{'text-red-700 font-bold': stat.label === 'Faltante'}">{{stat.label}}</p>
        <h3 class="text-2xl font-bold text-gray-800" [ngClass]="{'text-red-800': stat.label === 'Faltante'}">{{stat.value}}</h3>
      </div>
      <div class="w-10 h-10 rounded-full flex items-center justify-center {{stat.bg}} {{stat.color}} shadow-inner">
        <span class="material-icons-outlined">{{stat.icon}}</span>
      </div>
    </div>
  </div>

  <!-- Stats Row 2: Condición Física -->
  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Condición Física</h3>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
    <div *ngFor="let stat of stats | slice:7:10" (click)="navigateTo(stat)" class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center justify-between cursor-pointer hover:shadow-md transition-shadow hover:scale-[1.02] transform duration-200">
      <div>
        <p class="text-sm font-medium text-gray-500 mb-1">{{stat.label}}</p>
        <h3 class="text-2xl font-bold text-gray-800">{{stat.value}}</h3>
      </div>
      <div class="w-10 h-10 rounded-full flex items-center justify-center {{stat.bg}} {{stat.color}}">
        <span class="material-icons-outlined">{{stat.icon}}</span>
      </div>
    </div>
  </div>
</div>
