<div class="min-h-screen bg-gray-50 flex">

  <!-- Mobile Sidebar Overlay -->
  <div *ngIf="isSidebarOpen" (click)="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden"></div>

  <!-- Sidebar -->
  <aside [ngClass]="{'translate-x-0': isSidebarOpen, '-translate-x-full': !isSidebarOpen}" class="fixed md:static inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 flex flex-col transform md:translate-x-0 transition-transform duration-300 ease-in-out">
    
    <!-- Logo area -->
    <div class="p-6 flex flex-col items-center border-b border-gray-100">
      <img src="assets/logo.png" alt="ULA Logo" class="h-16 mb-4 object-contain">
      <h2 class="text-xl font-bold tracking-tight"><span class="text-primary">ULA</span> INVENTARIO</h2>
      <p class="text-sm font-medium text-gray-800 mt-1">Registro de bienes</p>
    </div>

    <!-- Navigation -->
    <div class="flex-1 overflow-y-auto py-6 px-4">
      <p class="text-xs font-bold text-gray-400 uppercase mb-4 px-2 tracking-wider">Menu Principal</p>
      <nav class="space-y-1 mb-8">
        <a routerLink="/dashboard/inicio" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-sm" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-blue-500 transition-all duration-200">
          <span class="material-icons-outlined">home</span> Inicio
        </a>
        <a routerLink="/dashboard/inventario" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-sm" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-blue-500 transition-all duration-200">
          <span class="material-icons-outlined">inventory</span> Inventario
        </a>
        <a routerLink="/dashboard/mantenimiento" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-sm" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-blue-500 transition-all duration-200">
          <span class="material-icons-outlined">build</span> Mantenimiento
        </a>
        <a routerLink="/dashboard/desincorporacion" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-sm" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-blue-500 transition-all duration-200">
          <span class="material-icons-outlined">delete_outline</span> Desincorporación
        </a>
        <a routerLink="/dashboard/bitacora" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-sm" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-blue-500 transition-all duration-200">
          <span class="material-icons-outlined">history</span> Bitácora
        </a>
      </nav>

      <div *ngIf="isSuperAdmin$ | async">
        <p class="text-xs font-bold text-gray-400 uppercase mb-4 px-2 tracking-wider mt-8">Configuración</p>
        <nav class="space-y-1">
          <a routerLink="/dashboard/manual-usuario" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-sm" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors">
            <span class="material-icons-outlined mr-3">menu_book</span> Manual de Usuario
          </a>
          <a *ngIf="isSuperAdmin$ | async" routerLink="/dashboard/usuarios" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-sm" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors">
            <span class="material-icons-outlined mr-3">people_alt</span> Usuarios
          </a>
        </nav>
      </div>
    </div>

    <!-- User Profile -->
    <div class="p-4 border-t border-gray-200">
      <div class="flex items-center">
        <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-lg">
          <span class="material-icons-outlined">person</span>
        </div>
        <div class="ml-3">
          <p class="text-sm font-bold text-gray-800">{{ user?.nombre || 'Usuario' }}</p>
          <p class="text-xs text-gray-500 font-medium uppercase">{{ user?.rol || 'Admin' }}</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden">
    
    <!-- Topbar (Buscador Removido) -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 lg:px-8">
      <div class="flex items-center">
        <button (click)="toggleSidebar()" class="md:hidden mr-4 text-gray-500 hover:text-gray-700 focus:outline-none">
          <span class="material-icons-outlined">menu</span>
        </button>
      </div>
      
      <div class="flex-1"></div>
      
      <div class="flex items-center space-x-6">
        <button class="text-gray-500 hover:text-gray-700 focus:outline-none relative">
          <span class="material-icons-outlined">notifications</span>
          <span *ngIf="alertasMantenimiento.length > 0" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full border border-white">{{ alertasMantenimiento.length }}</span>
        </button>
        <button (click)="logout()" class="flex items-center text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors text-sm font-medium focus:outline-none">
          <span class="material-icons-outlined mr-1 text-[20px]">logout</span> Salir
        </button>
      </div>
    </header>

    <!-- Dashboard Content (Router Outlet) -->
    <div class="flex-1 overflow-auto p-4 lg:p-8 relative">
      <div class="max-w-7xl mx-auto w-full">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
