version: "3.9"
name: ula_inventario

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ula_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && chmod +x ./node_modules/.bin/ng && npm start"

volumes:
  frontend_node_modules:
